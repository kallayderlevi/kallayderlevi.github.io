<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>180DC Budapest</title>
    <script>
      const path = window.location.pathname
      const query = window.location.search
      const hash = window.location.hash
      if (!query.startsWith('?/')) {
        window.location.replace(`${window.location.origin}/?/${path.slice(1)}${hash}`)
      }
    </script>
  </head>
  <body>
    <main style="font-family: system-ui, sans-serif; max-width: 38rem; margin: 15vh auto; padding: 2rem; text-align: center; color: #0f172a">
      <p style="color: #5d9f35; font-weight: 700; letter-spacing: .12em; text-transform: uppercase">180DC Budapest</p>
      <h1>Page not found</h1>
      <p>We are taking you back to the homepage.</p>
      <a href="/" style="color: #5d9f35; font-weight: 700">Go to homepage</a>
    </main>
  </body>
</html>
